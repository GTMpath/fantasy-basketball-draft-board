<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft Board 2026-27</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232d;--line:#2a323d;--text:#e6e9ee;--mute:#8b96a5;--accent:#f5a524;--me:#4cc38a;--red:#ef5350;--orange:#f08c3a;--yellow:#e3c44b;--blue:#5aa9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header label{color:var(--mute);font-size:11px;display:flex;gap:5px;align-items:center}
header input[type=number]{width:52px}
#clock{flex:1;min-width:300px;font-size:15px;font-weight:600}
#clock.me{color:var(--me)}
#clock small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
#left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#filters{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:12px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#filters label{color:var(--mute);font-size:12px;display:flex;gap:4px;align-items:center}
#tablewrap{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:right;padding:6px 7px;font-size:11px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
th.l,td.l{text-align:left}
th.punt{text-decoration:line-through;color:var(--red)}
th.sorted{color:var(--accent)}
td{padding:5px 7px;border-bottom:1px solid #1d232c;text-align:right;white-space:nowrap}
tr.taken{opacity:.33}
tr.mine td{background:rgba(76,195,138,.12)}
tr:hover td{background:var(--panel)}
.pname{font-weight:600;cursor:pointer}
.pname:hover{text-decoration:underline}
.sub{color:var(--mute);font-size:11px;margin-left:5px}
.flag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;color:#111;cursor:help}
.flag.red{background:var(--red)}.flag.orange{background:var(--orange)}.flag.yellow{background:var(--yellow)}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px;border:1px solid var(--line);color:var(--mute)}
.tag.sleeper,.tag.breakout{color:var(--me);border-color:var(--me)}.tag.bust{color:var(--red);border-color:var(--red)}
.h2{background:rgba(76,195,138,.42)}.h1{background:rgba(76,195,138,.18)}.l1{background:rgba(239,83,80,.16)}.l2{background:rgba(239,83,80,.4)}
.puntcell{opacity:.3}
#right{overflow:auto;background:var(--panel)}
section{padding:12px 14px;border-bottom:1px solid var(--line)}
h2{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rec{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border:0}
.rec b{font-size:14px}
.rec .why{color:var(--mute);font-size:12px}
.rec .wait{color:var(--blue)}.rec .now{color:var(--accent)}
.slots{display:grid;grid-template-columns:38px 1fr auto;gap:3px 8px;align-items:center}
.slots .s{color:var(--mute);font-size:11px}
.slots .empty{color:#4a5563}
.cat{display:grid;grid-template-columns:44px 1fr 70px 40px;gap:8px;align-items:center;margin:4px 0}
.bar{height:9px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:50%;border-radius:5px}
.rk{font-weight:700;text-align:right}
.good{color:var(--me)}.bad{color:var(--red)}.mid{color:var(--mute)}
ol.plan{margin:0;padding-left:18px}ol.plan li{margin:5px 0}
#log{font-size:12px;color:var(--mute);max-height:170px;overflow:auto}
#log div.m{color:var(--me)}
#drawer{position:fixed;right:430px;top:0;bottom:0;width:440px;background:var(--panel2);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:16px;overflow:auto;display:none;z-index:5;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
#drawer h3{margin:0 0 2px;font-size:18px}
#drawer p{margin:8px 0}
#drawer .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
#drawer .grid div{background:var(--bg);border-radius:5px;padding:6px;text-align:center}
#drawer .grid span{display:block;color:var(--mute);font-size:10px}
.warn{border-left:3px solid var(--orange);padding:6px 10px;background:rgba(240,140,58,.1);margin:8px 0}
.warn.red{border-color:var(--red);background:rgba(239,83,80,.12)}
a{color:var(--blue)}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 16px;color:var(--mute);font-weight:600}
#tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#planner,#scout{flex:1;overflow:auto;padding:14px 18px;display:none}
/* phones and narrow windows: let the page scroll as one column instead of fixed-height panes */
@media (max-width:900px){
  body{height:auto;overflow:auto}
  main{display:block}
  #left{border-right:0}
  #tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #right{overflow:visible;border-top:1px solid var(--line)}
  #drawer{right:0;left:0;width:auto}
}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:14px}
.card h2 b{color:var(--text)}
.mini td,.mini th{padding:4px 6px;font-size:12px}
.mini th{position:static;background:transparent;cursor:default}
.mx td,.mx th{padding:5px 4px;text-align:center;font-size:11px;border:0;width:44px}
.mx th{position:static;background:transparent;cursor:default;text-align:center}
.note{color:var(--mute);font-size:12px;margin:6px 0}
.chip.tgt{background:var(--me);color:#06231a;border-color:var(--me);font-weight:600}
.chip.off{text-decoration:line-through;color:var(--mute)}
.excerpt{white-space:normal;color:var(--mute);font-size:12px;max-width:520px;text-align:left}
</style>
</head>
<body>
<header>
  <div id="clock"></div>
  <label>Teams <input type="number" id="cfgTeams" min="4" max="20"></label>
  <label>My pick <input type="number" id="cfgSlot" min="1" max="20"></label>
  <label>Rounds <input type="number" id="cfgRounds" min="5" max="25"></label>
  <label title="8-cat drops turnovers as a category">Format <select id="cfgFmt"><option value="9">9-cat</option><option value="8">8-cat (no TO)</option></select></label>
  <button id="simBtn" title="Auto-draft the other teams by Yahoo ADP until it is your turn">Sim to my pick</button>
  <button id="undoBtn">Undo</button>
  <button id="resetBtn">Reset</button>
</header>
<main>
  <div id="left">
    <div id="tabs"><button data-view="board">Draft board</button><button data-view="planner">Build planner</button><button data-view="scout">Sleepers and rookies</button><button data-view="slot">Slot plan</button></div>
    <div id="planner"></div>
    <div id="scout"></div>
    <div id="slotplan" style="flex:1;overflow:auto;padding:14px 18px;display:none"></div>
    <div id="filters">
      <input id="q" placeholder="Search player or team" size="22">
      <span id="posChips"></span>
      <label><input type="checkbox" id="hideTaken" checked> Hide drafted</label>
      <label><input type="checkbox" id="hideRisk"> Hide red and orange flags</label>
      <span class="sub"><b>Fit</b> is who to pick: it counts missed games and injury risk. <b>Value/game</b> and <b>#</b> are per game only. Click a category header to punt it; click any other header to sort.</span>
    </div>
    <div id="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
  <div id="right">
    <section><h2 id="recTitle">Best picks for you</h2><div id="recs"></div></section>
    <section><h2>My roster</h2><div class="slots" id="slots"></div></section>
    <section><h2>My categories vs the league <span class="sub" id="catNote"></span></h2><div id="cats"></div></section>
    <section><h2>Draft rules for this league</h2><ol class="plan" id="plan"></ol></section>
    <section><h2>Pick log</h2><div id="log"></div></section>
    <section><h2>Data</h2><div id="meta" class="sub" style="margin:0"></div></section>
  </div>
</main>
<div id="drawer"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script>
const D = window.DRAFT, P = D.players, byId = Object.fromEntries(P.map(p => [p.id, p]));
const CATS = [["fg","FG%"],["ft","FT%"],["tpm","3PM"],["pts","PTS"],["reb","REB"],["ast","AST"],["stl","STL"],["blk","BLK"],["tov","TO"]];
const SLOTS = ["PG","SG","G","SF","PF","F","C","C","Util","Util","BN","BN","BN"];
const FITS = {PG:["PG"],SG:["SG"],G:["PG","SG"],SF:["SF"],PF:["PF"],F:["SF","PF"],C:["C"],Util:["PG","SG","SF","PF","C"],BN:["PG","SG","SF","PF","C"]};
const KEY = "draftboard-2026-27";
let S = Object.assign({teams:D.meta.teams, slot:5, fmt:9, rounds:D.meta.rounds, picks:[], punts:[], hideTaken:true, view:"board", plan:{anchor:"", n:6, cats:null}, scout:"sleeper", pos:"All", sort:"fit", dir:-1}, JSON.parse(localStorage.getItem(KEY) || "{}"));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// snake order: which team owns overall pick n (0-based)
const teamAt = n => { const r = Math.floor(n / S.teams), i = n % S.teams; return r % 2 ? S.teams - i : i + 1; };
const total = () => S.teams * S.rounds;
const onClock = () => S.picks.length < total() ? teamAt(S.picks.length) : null;
function myNext(after) { for (let n = after; n < total(); n++) if (teamAt(n) === S.slot) return n; return null; }
const takenSet = () => new Set(S.picks.map(p => p.id));
const roster = t => S.picks.filter(p => p.team === t).map(p => byId[p.id]);

// 8-cat leagues do not count turnovers, so TO behaves like a permanent punt
const isOff = c => S.punts.includes(c) || (S.fmt === 8 && c === "tov");
const active = () => CATS.map(c => c[0]).filter(c => !isOff(c));
const value = p => active().reduce((a, c) => a + p.z[c], 0);
const durability = p => Math.min(p.gp, 76) / 76;

function teamLine(ps) {
  const sum = k => ps.reduce((a, p) => a + p[k], 0);
  const fga = sum("fga"), fta = sum("fta");
  return {fg: fga ? sum("fgm") / fga : 0, ft: fta ? sum("ftm") / fta : 0, tpm: sum("tpm"), pts: sum("pts"), reb: sum("reb"), ast: sum("ast"), stl: sum("stl"), blk: sum("blk"), tov: -sum("tov")};
}
let _avgCache = {k: null, v: null};
function myAvgZ() {
  // my per-player average in each category, measured against what the other teams have drafted so far.
  // Opponents drafting by ADP load up on scorers, so "average" has to mean their average, not a neutral zero.
  const key = S.picks.length + ":" + S.slot;
  if (_avgCache.k === key) return _avgCache.v;
  const mine = roster(S.slot), ids = new Set(mine.map(p => p.id)), others = S.picks.filter(x => !ids.has(x.id)).map(x => byId[x.id]), out = {};
  CATS.forEach(([c]) => {
    const m = mine.length ? mine.reduce((a, p) => a + p.z[c], 0) / mine.length : 0;
    // compare like with like: their first n picks per team, roughly, are the top of their rosters just as mine are
    const o = others.length >= S.teams - 1 ? others.reduce((a, p) => a + p.z[c], 0) / others.length : 0;
    out[c] = m - o;
  });
  _avgCache = {k: key, v: out};
  return out;
}
function assignSlots(ps) {
  // fill the most restrictive slots first, most restricted players first
  const order = ["PG","SG","SF","PF","C","C","G","F","Util","Util","BN","BN","BN"], filled = {}, used = new Set();
  const sorted = [...ps].sort((a, b) => a.pos.length - b.pos.length);
  order.forEach((s, i) => { const p = sorted.find(p => !used.has(p.id) && p.pos.some(x => FITS[s].includes(x))); if (p) { used.add(p.id); filled[i] = p; } });
  const out = [], left = ps.filter(p => !used.has(p.id));
  SLOTS.forEach(s => { const i = order.findIndex((o, k) => o === s && filled[k] !== undefined && !filled[k]._x); if (i >= 0) { filled[i]._x = 1; out.push([s, filled[i]]); } else out.push([s, null]); });
  Object.values(filled).forEach(p => delete p._x);
  left.forEach(p => out.push(["+", p]));
  return out;
}
function openStarters() {
  const a = assignSlots(roster(S.slot));
  return a.filter(([s, p]) => !p && s !== "BN").map(([s]) => s);
}
const TUNE = {k: .9, mx: 1.8, mn: .3}; const needW = (avgZ, n) => n < 1 ? 1 : Math.max(TUNE.mn, Math.min(TUNE.mx, 1 - (n < 3 ? TUNE.k * .55 : TUNE.k) * avgZ));
function fit(p) {
  const mine = roster(S.slot), avg = myAvgZ(), n = mine.length, round = Math.floor(S.picks.length / S.teams) + 1;
  // need weights: a category you already lead by a mile is worth little more, one you are losing is worth a lot
  let v = active().reduce((a, c) => a + p.z[c] * needW(avg[c], n), 0);
  // missed games cost more than their share: an empty slot in a weekly matchup, and a wasted pick if he never returns
  v = (v + 2.5) * Math.pow(Math.min(p.gp, 78) / 78, 1.6) - 2.5;
  const risky = mine.filter(x => x.flag === "orange" || x.flag === "red").length;
  if (p.flag === "red") v -= 4;
  // one gamble at most, never early, and cheaper once he has slid two rounds past his ADP
  const slid = p.yahoo_adp && S.picks.length + 1 >= p.yahoo_adp + 2 * S.teams;
  if (p.flag === "orange") v -= (slid ? .3 : .8) + 1.2 * risky + (round <= 3 ? 1 : 0);
  if (p.flag === "yellow") v -= .2;
  v += p.age_adj || 0;  // aging curve: young players gain, players past 29 lose
  v -= p.jump_pen || 0;
  if (p.min_bump) v -= .3;  // projected minutes 3+ above a healthy last season tend not to arrive (scripts/build.py role_bump)  // older jump season: only the part the projection keeps beyond what history supports (scripts/jump_check.py)
  if (p.po) v += .12 * (p.po - 10.6);  // games in the league's three playoff weeks (range 9 to 12)
  const open = openStarters().filter(s => s !== "Util"), left = S.rounds - n;
  if (round >= 5 && open.includes("C") && p.pos.includes("C")) v += .4;
  if (open.length && left <= open.length + 3) v += open.some(s => p.pos.some(x => FITS[s].includes(x))) ? .8 : -.8;
  // he should still be on the board at my following pick, so someone scarcer goes first; more so for each later pick he would last to
  // (without the extra steps a punt build took Reed Sheppard, ADP 120, at pick 20)
  let nx = myNext(S.picks.length), lasts = 0;
  for (let k = 0; k < 3 && nx !== null; k++) { nx = myNext(nx + 1); if (nx !== null && p.yahoo_adp && p.yahoo_adp > nx + 8) lasts++; else break; }
  v -= .6 * lasts;
  return v;
}

function draft(id) {
  const t = onClock(); if (!t || takenSet().has(id)) return;
  S.picks.push({id, team: t}); save(); render();
}
function simToMe() {
  const taken = takenSet();
  while (onClock() && onClock() !== S.slot) {
    const pool = P.filter(p => !taken.has(p.id) && p.yahoo_adp).sort((a, b) => a.yahoo_adp - b.yahoo_adp).slice(0, 4);
    if (!pool.length) break;
    const p = pool[Math.floor(Math.pow(Math.random(), 2) * pool.length)];
    S.picks.push({id: p.id, team: onClock()}); taken.add(p.id);
  }
  save(); render();
}

const cls = z => z >= 1.5 ? "h2" : z >= .5 ? "h1" : z <= -1.5 ? "l2" : z <= -.5 ? "l1" : "";
const fmt = {fg: p => (p.fgm / p.fga).toFixed(3).slice(1), ft: p => (p.ftm / p.fta).toFixed(3).slice(1), tpm: p => p.tpm.toFixed(1), pts: p => p.pts.toFixed(1), reb: p => p.reb.toFixed(1), ast: p => p.ast.toFixed(1), stl: p => p.stl.toFixed(1), blk: p => p.blk.toFixed(1), tov: p => p.tov.toFixed(1)};
const flagLabel = {red: "AVOID", orange: "RISK", yellow: "WATCH"};
const flagHtml = p => p.flag ? `<span class="flag ${p.flag}" title="${esc(p.reasons.join(" | "))}">${flagLabel[p.flag]}</span>` : "";
const tagCount = (p, k) => new Set(p.tags.filter(t => t.kind === k).flatMap(t => t.sources && t.sources.length ? t.sources : [t.text])).size;
const clip = (t, n) => t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "") + "..." : t;
// a badge needs three separate sources behind it, otherwise half the board is a "sleeper"
const z3Txt = p => p.z3 ? `per-game value ${p.z3.map(x => x == null ? "n/a" : x).join(" / ")} over the last three seasons, projected ${p.z_proj}, history-based expectation ${p.z_exp}` : "";
const peakHtml = p => p.peak && p.jump_kind ? `<span class="tag bust" title="Age ${p.age}, ${p.jump_kind}: ${z3Txt(p)}. Fit penalty ${p.jump_pen}.">${p.jump_kind === "career yr" ? "career yr" : p.jump_kind === "bounce-back" ? "bounce-back" : "injury rebound"}${p.jump_pen >= .2 ? " −" + p.jump_pen : ""}</span>` : "";
const bumpHtml = p => p.min_bump ? `<span class="tag bust" title="Projected for ${p.min_bump} more minutes than his 50+ game 2025-26. In the last two seasons, unconfirmed bumps like this fell short of projection more often. Fit −0.3.">+${p.min_bump} min?</span>` : "";
const tagHtml = p => peakHtml(p) + bumpHtml(p) + ["sleeper", "breakout", "bust", "rookie"].filter(k => tagCount(p, k) >= (k === "rookie" ? 1 : 3)).map(k => `<span class="tag ${k}" title="${k === "rookie" ? "2026 rookie" : tagCount(p, k) + " sources"}">${k}${k === "rookie" ? "" : " " + tagCount(p, k)}</span>`).join("");

const COLTIP = {
  rank: "Rank by per-game 9-cat value. Ignores missed games and injury risk.",
  fit: "Who to pick: per-game value adjusted for projected games, injury flags, age, your roster's category needs and whether he lasts to your next pick.",
  value: "Per-game 9-cat value only. A player who misses half the season can still rank high here (Embiid). Use Fit to decide.",
  gp: "Projected games this season, after injury history and news."
};
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  $("filters").style.display = $("tablewrap").style.display = S.view === "board" ? "" : "none";
  $("planner").style.display = S.view === "planner" ? "block" : "none";
  $("scout").style.display = S.view === "scout" ? "block" : "none";
  if (S.view === "planner") renderPlanner();
  if (S.view === "scout") renderScout();
  $("slotplan").style.display = S.view === "slot" ? "block" : "none";
  if (S.view === "slot") renderSlot();
  const taken = takenSet(), mine = new Set(roster(S.slot).map(p => p.id));
  const n = S.picks.length, t = onClock(), next = myNext(n), after = next === null ? null : myNext(next + 1);
  // clock
  const c = $("clock");
  if (!t) { c.className = ""; c.innerHTML = "Draft complete"; }
  else {
    const rd = Math.floor(n / S.teams) + 1, pk = n % S.teams + 1, me = t === S.slot;
    c.className = me ? "me" : "";
    c.innerHTML = `${me ? "YOUR PICK" : "Team " + t + " is picking"} · Round ${rd}, pick ${pk} (overall ${n + 1})<small>${me ? (after !== null ? `Your next pick after this is overall ${after + 1}, which is ${after - n - 1} picks away.` : "This is your last pick.") : (next !== null ? `You pick in ${next - n} (overall ${next + 1}). Click whoever each team takes.` : "")}</small>`;
  }
  // header
  const cols = [["rank","#"],["name","Player","l"],["yahoo_adp","ADP"],["yahoo_rank","Y rank"],["fit","Fit"],["value","Value/game"],["age","Age"],["last_gp","GP 25-26"],["gp","Proj GP"],["po","PO"]];
  $("thead").innerHTML = "<tr>" + cols.map(([k, l, a]) => `<th class="${a || ""} ${S.sort === k ? "sorted" : ""}" data-sort="${k}" title="${COLTIP[k] || ""}">${l}</th>`).join("") +
    CATS.map(([k, l]) => `<th class="${isOff(k) ? "punt" : ""}" data-punt="${k}" title="Click to punt ${l}">${l}</th>`).join("") + "<th></th></tr>";
  // rows
  const q = $("q").value.trim().toLowerCase();

// ---------- Build planner ----------
const CN = Object.fromEntries(CATS);
const POOL = [...P].sort((a, b) => b.zsum - a.zsum).slice(0, D.meta.teams * D.meta.rounds);
const CORR = (() => {
  const m = {}, mean = c => POOL.reduce((a, p) => a + p.z[c], 0) / POOL.length, mu = {}, sd = {};
  CATS.forEach(([c]) => { mu[c] = mean(c); sd[c] = Math.sqrt(POOL.reduce((a, p) => a + (p.z[c] - mu[c]) ** 2, 0) / POOL.length); });
  CATS.forEach(([a]) => { m[a] = {}; CATS.forEach(([b]) => m[a][b] = POOL.reduce((t, p) => t + (p.z[a] - mu[a]) * (p.z[b] - mu[b]), 0) / (POOL.length * sd[a] * sd[b])); });
  return m;
})();
function planCore() {  // the players the build is anchored on
  const mine = roster(S.slot), a = byId[S.plan.anchor];
  if (a && !mine.some(p => p.id === a.id)) return {core: [a, ...mine], hypo: true};
  return {core: mine, hypo: false};
}
function autoCats(core, n) {
  // start from what the core is best at, then add the categories that travel with it
  const avg = c => core.reduce((a, p) => a + p.z[c], 0) / core.length, all = CATS.map(c => c[0]).filter(c => !(S.fmt === 8 && c === "tov")), chosen = [];
  while (chosen.length < n) {

    all.filter(c => !chosen.includes(c)).forEach(c => { const sc = avg(c) + (chosen.length ? .9 * chosen.reduce((a, x) => a + CORR[c][x], 0) / chosen.length : 0); if (sc > bs) { bs = sc; best = c; } });
    chosen.push(best);

}
function myPickInRound(r) { return r % 2 ? (r - 1) * S.teams + S.slot : r * S.teams - S.slot + 1; }

  let v = cats.reduce((a, c) => { const have = core.reduce((t, x) => t + x.z[c], 0) / core.length; return a + p.z[c] * needW(have, core.length); }, 0);
  v = (v + 2) * Math.pow(Math.min(p.gp, 78) / 78, 1.6) - 2;

  const chips = `<div class="prow">${CATS.map(([c, l]) => `<button class="chip ${cats.includes(c) ? "tgt" : "off"}" data-plancat="${c}" title="Click to move ${l} in or out of the build">${l}</button>`).join("")}

    <div class="note">Build: win <b>${cats.map(c => CN[c]).join(", ")}</b>${losing.length ? " and stop paying for " + losing.join(", ") : ""}. Every category is its own win in this league, so a ${cats.length}-category build tops out at ${cats.length}-${9 - cats.length} in a week. Six or seven is the realistic target; four and five show you the core.</div></div>`;

function corrCard(cats) {
  const cell = v => `background:rgba(${v >= 0 ? "76,195,138" : "239,83,80"},${Math.min(.75, Math.abs(v) * .8)})`;
  const pairs = []; CATS.forEach(([a], i) => CATS.slice(i + 1).forEach(([b]) => pairs.push([CORR[a][b], a, b])));
  pairs.sort((x, y) => y[0] - x[0]);

  (D.meta.offboard || []).filter(o => o.kind === k).forEach(o => { let r = rows.find(x => x.off && x.name === o.name); if (!r) rows.push(r = {off: true, name: o.name, team: o.team, adp: o.yahoo_adp, ts: [], n: 0}); r.ts.push({text: o.text, sources: o.sources}); r.n = new Set(r.ts.flatMap(t => t.sources || [])).size; });
  rows.sort((a, b) => b.n - a.n || ((a.p?.yahoo_adp ?? a.adp ?? 999) - (b.p?.yahoo_adp ?? b.adp ?? 999)));
  $("scout").innerHTML = `<div class="prow">${kinds.map(([v, l]) => `<button class="chip ${k === v ? "on" : ""}" data-scout="${v}">${l}</button>`).join("")}<span class="note">Ranked by how many separate articles, videos and mock drafts named the player. ${D.meta.sources.length} sources read${D.meta.mocks?.length ? ", " + D.meta.mocks.length + " expert mock drafts" : ""}.</span></div>
    <table><thead><tr><th class="l">Player</th><th>Sources</th><th>Yahoo ADP</th><th>Mock avg</th><th>GP</th><th>Value/game rank</th><th class="l">What they say</th><th></th></tr></thead><tbody>
    ${rows.map(r => r.off ? `<tr><td class="l"><b>${esc(r.name)}</b><span class="sub">${esc(r.team || "")} · no projection yet</span></td><td class="num">${r.n}</td><td class="num">${r.adp ?? "-"}</td><td></td><td></td><td></td><td class="excerpt">${esc(clip(r.ts.map(t => t.text).join(" "), 340))}</td><td></td></tr>`
      : `<tr class="${taken.has(r.p.id) ? "taken" : ""}"><td class="l"><span class="pname" data-open="${esc(r.p.id)}">${esc(r.p.name)}</span><span class="sub">${r.p.team} · ${r.p.pos.join("/")}</span>${flagHtml(r.p)}</td><td class="num">${r.n}</td><td class="num">${r.p.yahoo_adp ?? "-"}</td><td class="num">${r.p.mock ?? "-"}</td><td class="num ${r.p.gp < 60 ? "bad" : ""}">${r.p.gp}</td><td class="num">${r.p.rank}</td><td class="excerpt">${esc(clip(r.ts.map(t => t.text).join(" "), 340))}</td><td>${taken.has(r.p.id) ? "" : `<button data-draft="${esc(r.p.id)}">${onClock() === S.slot ? "Draft" : "Taken"}</button>`}</td></tr>`).join("") || `<tr><td class="l" colspan="8">Nothing in this list yet.</td></tr>`}</tbody></table>`;
}

// ---------- Slot plan: simulate many drafts from my slot ----------
const expPick = p => p.yahoo_adp && p.yahoo_rank ? (p.yahoo_adp + p.yahoo_rank) / 2 : (p.yahoo_adp ?? p.yahoo_rank ?? 400);
const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return (u - 2) * 1.73; };
let SLOTRES = null;
function runSlotSims(n) {
  const keep = S.picks, res = {slot: S.slot, n, rounds: {}, cats: Object.fromEntries(CATS.map(c => [c[0], 0]))};
  for (let i = 0; i < n; i++) {
    S.picks = [];
    const taken = new Set(), noise = Object.fromEntries(P.map(p => { const e = expPick(p); return [p.id, e + gauss() * (1.5 + .13 * e)]; }));
    const order = [...P].sort((a, b) => noise[a.id] - noise[b.id]);
    while (onClock()) {
      const t = onClock(); let pick;
      if (t === S.slot) {
        const r = roster(S.slot).length + 1, avail = P.filter(p => !taken.has(p.id) && p.flag !== "red");
        const ranked = avail.map(p => [fit(p), p]).sort((a, b) => b[0] - a[0]);
        const R = res.rounds[r] = res.rounds[r] || {pick: S.picks.length + 1, took: {}, top: {}};
        pick = ranked[0][1]; R.took[pick.id] = (R.took[pick.id] || 0) + 1;
        ranked.slice(0, 5).forEach(([, p]) => R.top[p.id] = (R.top[p.id] || 0) + 1);
      } else pick = order.find(p => !taken.has(p.id));
      taken.add(pick.id); S.picks.push({id: pick.id, team: t});
    }
    const lines = {}; for (let t = 1; t <= S.teams; t++) lines[t] = teamLine(roster(t));
    CATS.forEach(([c]) => res.cats[c] += Object.values(lines).filter(x => x[c] > lines[S.slot][c]).length + 1);
  }
  S.picks = keep; SLOTRES = res;
}
function renderSlot() {
  const el = $("slotplan"), R = SLOTRES && SLOTRES.slot === S.slot ? SLOTRES : null;
  let h = `<div class="prow"><b>Draft slot ${S.slot} of ${S.teams}</b><button class="primary" data-slotrun="150">Simulate 150 drafts from this slot</button><span class="note">Change "My pick" in the top bar when you learn your slot, then run this again. Other teams draft near Yahoo ADP and Yahoo rank with realistic noise, and you take the board's top Fit pick each round${S.punts.length ? ", punting " + S.punts.map(c => CN[c]).join(", ") : ""}.</span></div>`;
  if (!R) { el.innerHTML = h + `<div class="note">No simulation run for slot ${S.slot} yet.</div>`; return; }
  h += `<div class="card"><h2>Average category rank across ${R.n} simulated drafts <span class="sub">1 is best of ${S.teams}</span></h2><div class="prow">${CATS.map(([c, l]) => { const v = R.cats[c] / R.n; return `<span class="chip" style="border-color:${v <= 4.5 ? "var(--me)" : v >= 8 ? "var(--red)" : "var(--line)"}">${l} <b>${v.toFixed(1)}</b></span>`; }).join("")}</div></div>`;
  h += `<div class="pgrid" style="grid-template-columns:1fr 1fr">` + Object.entries(R.rounds).map(([r, x]) => {
    const rows = Object.entries(x.top).sort((a, b) => b[1] - a[1]).slice(0, 6);
    return `<div class="card"><h2>Round ${r} <b>pick ${x.pick}</b></h2><table class="mini"><thead><tr><th class="l">Player</th><th>ADP</th><th>GP</th><th title="Share of drafts where he was one of your five best options at this pick">In your top 5</th><th title="Share of drafts where he was the single best pick">Best pick</th></tr></thead><tbody>
      ${rows.map(([id, c]) => { const p = byId[id]; return `<tr><td class="l"><span class="pname" data-open="${esc(id)}">${esc(p.name)}</span><span class="sub">${p.pos.join("/")}</span>${flagHtml(p)}${tagHtml(p)}</td><td class="num">${p.yahoo_adp ?? "-"}</td><td class="num">${p.gp}</td><td class="num">${Math.round(100 * c / R.n)}%</td><td class="num">${Math.round(100 * (x.took[id] || 0) / R.n)}%</td></tr>`; }).join("")}</tbody></table></div>`; }).join("") + `</div>`;
  el.innerHTML = h;
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.draft) draft(t.dataset.draft);
  else if (t.dataset.open) openDrawer(t.dataset.open);
  else if (t.id === "closeDrawer") $("drawer").style.display = "none";
  else if (t.dataset.view) { S.view = t.dataset.view; save(); render(); }
  else if (t.dataset.slotrun) { t.textContent = "Simulating..."; setTimeout(() => { runSlotSims(+t.dataset.slotrun); render(); }, 30); }
  else if (t.dataset.scout) { S.scout = t.dataset.scout; save(); render(); }
  else if (t.dataset.plann) { S.plan.n = +t.dataset.plann; S.plan.cats = null; save(); render(); }
  else if (t.dataset.planauto) { S.plan.cats = null; save(); render(); }
  else if (t.dataset.planclear) { S.plan.anchor = ""; S.plan.cats = null; save(); render(); }
  else if (t.dataset.plancat) { const c = t.dataset.plancat, cur = S.plan.cats || autoCats(planCore().core, S.plan.n); S.plan.cats = cur.includes(c) ? cur.filter(x => x !== c) : [...cur, c]; save(); render(); }
  else if (t.dataset.planapply) { const cur = S.plan.cats || autoCats(planCore().core, S.plan.n); S.punts = CATS.map(c => c[0]).filter(c => !cur.includes(c)); S.view = "board"; save(); render(); }
  else if (t.dataset.pos) { S.pos = t.dataset.pos; save(); render(); }
  else if (t.dataset.punt) { const k = t.dataset.punt; if (S.fmt === 8 && k === "tov") return; S.punts = S.punts.includes(k) ? S.punts.filter(x => x !== k) : [...S.punts, k]; save(); render(); }
  else if (t.dataset.sort) { const k = t.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = ["name","yahoo_adp","yahoo_rank","rank"].includes(k) ? 1 : -1; } save(); render(); }
});
$("q").addEventListener("input", render);
document.addEventListener("change", e => { if (e.target.id === "planAnchor") { const v = e.target.value.trim().toLowerCase(), p = P.find(x => x.name.toLowerCase() === v) || (v && P.find(x => x.name.toLowerCase().includes(v))); S.plan.anchor = p ? p.id : ""; S.plan.cats = null; save(); render(); } });
$("hideTaken").addEventListener("change", e => { S.hideTaken = e.target.checked; save(); render(); });
$("hideRisk").addEventListener("change", e => { S.hideRisk = e.target.checked; save(); render(); });
$("cfgFmt").addEventListener("change", e => { S.fmt = +e.target.value; S.punts = S.punts.filter(c => !(S.fmt === 8 && c === "tov")); S.plan.cats = null; _avgCache.k = null; save(); render(); });
[["Teams","teams"],["Slot","slot"],["Rounds","rounds"]].forEach(([i, k]) => $("cfg" + i).addEventListener("change", e => { const v = parseInt(e.target.value, 10); if (v > 0) { if (S.picks.length && k !== "slot" && !confirmReset()) return render(); S[k] = v; if (S.slot > S.teams) S.slot = S.teams; save(); render(); } }));
function confirmReset() { if (!window.confirm("Changing this clears the picks made so far. Continue?")) return false; S.picks = []; return true; }
$("undoBtn").onclick = () => { S.picks.pop(); save(); render(); };
$("resetBtn").onclick = () => { if (window.confirm("Clear every pick and start over?")) { S.picks = []; save(); render(); } };
$("simBtn").onclick = simToMe;
document.addEventListener("keydown", e => { if (e.key === "Escape") $("drawer").style.display = "none"; if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });

// optional deep link, e.g. index.html#view=planner&anchor=anthony edwards
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k === "view") S.view = v; if (k === "anchor" && byId[v]) { S.plan.anchor = v; S.plan.cats = null; } if (k === "n") S.plan.n = +v; if (k === "scout") S.scout = v; if (k === "slot") S.slot = +v; if (k in TUNE) TUNE[k] = +v; if (k === "simrun") setTimeout(() => { runSlotSims(+v); render(); }, 50); });
$("plan").innerHTML = (window.PLAN || []).map(x => `<li>${x}</li>`).join("");
$("meta").innerHTML = `${D.meta.n} players. Built ${D.meta.built}. Projections: average of ESPN and Yahoo (Rotowire) 2026-27, plus Hashtag Basketball for the top 30. ADP and positions: Yahoo via Hashtag Basketball. ${D.meta.injuries} researched injury entries.` + (D.meta.sources.length ? "<br>Articles read: " + D.meta.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.site || s.title)}</a>`).join(", ") : "");
render();
</script>
</body>
